{% extends "base.html" %}
{% block title %}MSME Ledger Digitisation{% endblock %}
{% block content %}
  <section class="hero">
    <div class="hero-copy">
      <h1>Digitise handwritten ledgers</h1>
      <p class="lede">Photo in. Editable table out.</p>

      <form id="upload" action="{{ url_for('process') }}" method="post" enctype="multipart/form-data" class="upload-form">
        <input type="file" name="image" accept="image/png,image/jpeg,.tif,.tiff,.bmp,.webp" required aria-label="Ledger photo">
        <button type="submit" class="btn btn-solid">Digitise</button>
      </form>
    </div>

    <div class="hero-emblem">
      {% include "partials/emblem.svg" %}
    </div>
  </section>
{% endblock %}
