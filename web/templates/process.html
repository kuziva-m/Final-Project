{% extends "base.html" %}
{% block title %}Review · MSME Ledger Digitisation{% endblock %}
{% block content %}
  <section class="review">
    <h1>Review</h1>
    <p class="meta"><span class="filename">{{ source_file }}</span> · {{ used_engine }}</p>

    <div class="previews">
      <figure>
        <figcaption>Raw</figcaption>
        <img src="{{ url_for('uploaded_file', filename=raw_filename) }}" alt="Raw upload">
      </figure>
      <figure>
        <figcaption>Cleaned</figcaption>
        <img src="{{ url_for('processed_file', filename=processed_filename) }}" alt="Preprocessed image">
      </figure>
    </div>

    <form action="{{ url_for('save') }}" method="post" class="rows-form">
      <input type="hidden" name="source_file" value="{{ source_file }}">
      <input type="hidden" name="num_rows" value="{{ rows|length }}">

      <div class="sheet">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Item</th>
              <th scope="col">Qty</th>
              <th scope="col">Price</th>
              <th scope="col">Total</th>
            </tr>
          </thead>
          <tbody>
            {% for row in rows %}
            <tr>
              <td><input type="text" name="date_{{ loop.index0 }}" value="{{ row.date }}" aria-label="Date, row {{ loop.index }}"></td>
              <td><input type="text" name="item_{{ loop.index0 }}" value="{{ row.item }}" aria-label="Item, row {{ loop.index }}"></td>
              <td><input type="text" name="qty_{{ loop.index0 }}" value="{{ row.qty }}" aria-label="Quantity, row {{ loop.index }}"></td>
              <td><input type="text" name="price_{{ loop.index0 }}" value="{{ row.price }}" aria-label="Price, row {{ loop.index }}"></td>
              <td><input type="text" name="total_{{ loop.index0 }}" value="{{ row.total }}" aria-label="Total, row {{ loop.index }}"></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-solid">Save</button>
        <a class="btn btn-outline" href="{{ url_for('index') }}#upload">Scan another</a>
      </div>
    </form>
  </section>
{% endblock %}
